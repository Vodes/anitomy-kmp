name: Build portable Linux native artifacts
description: Builds the portable bridge and JNI library with the pinned conda toolchain.

inputs:
  target:
    description: Kotlin/Native target name.
    required: true
  compiler-package:
    description: conda-forge compiler package.
    required: true
  sysroot-package:
    description: conda-forge glibc sysroot package.
    required: true
  compiler:
    description: C++ compiler executable within the conda environment.
    required: true
  cmake-system:
    description: Optional CMake system name used for cross-compilation.
    required: false
    default: ""
  cmake-processor:
    description: Optional CMake processor used for cross-compilation.
    required: false
    default: ""
  copy-sysroot:
    description: Whether to copy the target sysroot beside the artifacts for QEMU.
    required: false
    default: "false"
  native-tests:
    description: Whether to build and run the native C ABI bridge tests.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Build native artifacts
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        COMPILER_PACKAGE: ${{ inputs.compiler-package }}
        SYSROOT_PACKAGE: ${{ inputs.sysroot-package }}
        COMPILER: ${{ inputs.compiler }}
        CMAKE_SYSTEM: ${{ inputs.cmake-system }}
        CMAKE_PROCESSOR: ${{ inputs.cmake-processor }}
        COPY_SYSROOT: ${{ inputs.copy-sysroot }}
        NATIVE_TESTS: ${{ inputs.native-tests }}
      run: |
        mkdir -p "build/native/${TARGET}"
        docker run --rm \
          -e TARGET -e COMPILER_PACKAGE -e SYSROOT_PACKAGE -e COMPILER \
          -e CMAKE_SYSTEM -e CMAKE_PROCESSOR -e COPY_SYSROOT -e NATIVE_TESTS \
          -v "$GITHUB_WORKSPACE:/work" -v "$JAVA_HOME:/jdk:ro" -w /work \
          quay.io/condaforge/miniforge3@sha256:ccd8a580bf94ec3cd6e8b35ed243a2b88394fe5a3ccb5da97ee3400c1bbcd5f9 \
          bash -lc '
            conda create --quiet --yes -p /toolchain -c conda-forge \
              "${COMPILER_PACKAGE}=15.2.0" "${SYSROOT_PACKAGE}=2.17" \
              cmake=4.3.4 ninja=1.13.2
            export PATH="/toolchain/bin:${PATH}"
            export CXX="/toolchain/bin/${COMPILER}"
            export JAVA_HOME=/jdk
            export ANITOMY_BUILD_JNI=ON
            export ANITOMY_BUILD_TESTS="${NATIVE_TESTS}"
            export ANITOMY_CMAKE_SYSTEM_NAME="${CMAKE_SYSTEM}"
            export ANITOMY_CMAKE_SYSTEM_PROCESSOR="${CMAKE_PROCESSOR}"
            scripts/build-native.sh "${TARGET}"
            if [[ "${NATIVE_TESTS}" == "true" ]]; then
              ctest --test-dir "build/native/${TARGET}" --output-on-failure
            fi
            if [[ "${COPY_SYSROOT}" == "true" ]]; then
              cp -a "/toolchain/${COMPILER%%-c++}/sysroot" \
                "build/native/${TARGET}/sysroot"
            fi
            chmod -R a+rwX "build/native/${TARGET}"
          '
