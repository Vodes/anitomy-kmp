name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  jvm-and-cpp:
    name: JVM and C++ bridge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake g++ ninja-build
      - name: Test the C ABI bridge
        run: |
          cmake -S native -B build/native/cpp-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DANITOMY_KMP_BUILD_JNI=OFF \
            -DANITOMY_KMP_BUILD_TESTS=ON
          cmake --build build/native/cpp-tests --parallel
          ctest --test-dir build/native/cpp-tests --output-on-failure
      - name: Test untouched Anitomy with GCC 16
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            fedora:44@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898 \
            bash -lc '
            dnf install --quiet --assumeyes cmake gcc-c++ ninja-build
            cmake -S vendor/anitomy -B build/native/upstream-tests -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
            cmake --build build/native/upstream-tests --parallel
            ctest --test-dir build/native/upstream-tests --output-on-failure
          '
      - name: Test JVM bindings
        run: ./gradlew jvmTest --no-daemon
      - name: Verify Java 17 bytecode
        run: |
          javap -verbose \
            build/classes/kotlin/jvm/main/pw/vodes/anitomy/AnitomyKt.class |
            grep "major version: 61"

  linux-native:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linuxX64
            compiler_package: gxx_linux-64
            sysroot_package: sysroot_linux-64
            compiler: x86_64-conda-linux-gnu-c++
            gradle_task: linuxX64Test
            cmake_system: ""
            cmake_processor: ""
          - target: linuxArm64
            compiler_package: gxx_linux-aarch64
            sysroot_package: sysroot_linux-aarch64
            compiler: aarch64-conda-linux-gnu-c++
            gradle_task: linkDebugTestLinuxArm64
            cmake_system: Linux
            cmake_processor: aarch64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build portable native archive
        env:
          TARGET: ${{ matrix.target }}
          COMPILER_PACKAGE: ${{ matrix.compiler_package }}
          SYSROOT_PACKAGE: ${{ matrix.sysroot_package }}
          COMPILER: ${{ matrix.compiler }}
          CMAKE_SYSTEM: ${{ matrix.cmake_system }}
          CMAKE_PROCESSOR: ${{ matrix.cmake_processor }}
        run: |
          docker run --rm \
            -e TARGET -e COMPILER_PACKAGE -e SYSROOT_PACKAGE -e COMPILER \
            -e CMAKE_SYSTEM -e CMAKE_PROCESSOR \
            -v "$GITHUB_WORKSPACE:/work" -v "$JAVA_HOME:/jdk:ro" -w /work \
            quay.io/condaforge/miniforge3@sha256:ccd8a580bf94ec3cd6e8b35ed243a2b88394fe5a3ccb5da97ee3400c1bbcd5f9 \
            bash -lc '
              conda create --quiet --yes -p /toolchain -c conda-forge \
                "${COMPILER_PACKAGE}=15.2.0" "${SYSROOT_PACKAGE}=2.17" \
                cmake=4.3.4 ninja=1.13.2
              export PATH="/toolchain/bin:${PATH}"
              export CXX="/toolchain/bin/${COMPILER}"
              export JAVA_HOME=/jdk
              export ANITOMY_BUILD_JNI=ON
              export ANITOMY_CMAKE_SYSTEM_NAME="${CMAKE_SYSTEM}"
              export ANITOMY_CMAKE_SYSTEM_PROCESSOR="${CMAKE_PROCESSOR}"
              scripts/build-native.sh "${TARGET}"
              if [[ "${TARGET}" == linuxArm64 ]]; then
                cp -a /toolchain/aarch64-conda-linux-gnu/sysroot \
                  "build/native/${TARGET}/sysroot"
              fi
              chmod -R a+rwX "build/native/${TARGET}"
            '
      - name: Compile and test Kotlin/Native binding
        run: >-
          ./gradlew ${{ matrix.gradle_task }} --no-daemon
          -Panitomy.nativeLibraryDir.${{ matrix.target }}=build/native/${{ matrix.target }}
      - name: Test release-style Linux JNI library
        if: matrix.target == 'linuxX64'
        run: |
          mkdir -p build/ci-jvm/linux-x64
          cp build/native/linuxX64/libanitomy-kmp.so build/ci-jvm/linux-x64/
          ./gradlew jvmTest --no-daemon -Panitomy.jvmNativesDir=build/ci-jvm
      - name: Run ARM64 tests under QEMU
        if: matrix.target == 'linuxArm64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user
          qemu-aarch64 \
            -L build/native/linuxArm64/sysroot \
            build/bin/linuxArm64/debugTest/test.kexe

  windows-native:
    name: mingwX64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
      - name: Build MinGW native archive
        shell: msys2 {0}
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          ANITOMY_BUILD_JNI=ON CXX=g++ scripts/build-native.sh mingwX64
      - name: Stage Windows JNI library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/ci-jvm/windows-x64
          Copy-Item build/native/mingwX64/anitomy-kmp.dll build/ci-jvm/windows-x64/
      - name: Test Kotlin/Native and JVM bindings
        shell: pwsh
        run: >-
          ./gradlew.bat mingwX64Test jvmTest --no-daemon
          -Panitomy.nativeLibraryDir.mingwX64=build/native/mingwX64
          -Panitomy.jvmNativesDir=build/ci-jvm

  macos-native:
    name: macosArm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Ninja
        run: brew install ninja
      - name: Build Apple Clang native archive
        run: ANITOMY_BUILD_JNI=ON CXX=clang++ scripts/build-native.sh macosArm64
      - name: Stage macOS JNI library
        run: |
          mkdir -p build/ci-jvm/macos-arm64
          cp build/native/macosArm64/libanitomy-kmp.dylib build/ci-jvm/macos-arm64/
      - name: Test Kotlin/Native and JVM bindings
        run: >-
          ./gradlew macosArm64Test jvmTest --no-daemon
          -Panitomy.nativeLibraryDir.macosArm64=build/native/macosArm64
          -Panitomy.jvmNativesDir=build/ci-jvm
