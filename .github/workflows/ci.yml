name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  jvm-and-cpp:
    name: JVM and C++ bridge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build and test the bridge with GCC 15
        uses: ./.github/actions/build-linux-native
        with:
          target: linuxX64
          compiler-package: gxx_linux-64
          sysroot-package: sysroot_linux-64
          compiler: x86_64-conda-linux-gnu-c++
          native-tests: "true"
      - name: Test untouched Anitomy with GCC 16
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -w /tmp \
            fedora:44@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898 \
            bash -lc '
            dnf install --quiet --assumeyes cmake gcc-c++ ninja-build
            cp -a /work/vendor/anitomy /tmp/anitomy
            cmake -S /tmp/anitomy -B /tmp/upstream-tests -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
            cmake --build /tmp/upstream-tests --parallel
            ctest --test-dir /tmp/upstream-tests --output-on-failure
          '
      - name: Stage Linux JNI library
        run: |
          mkdir -p build/ci-jvm/linux-x64
          cp build/native/linuxX64/libanitomy-kmp.so build/ci-jvm/linux-x64/
      - name: Test JVM bindings
        run: >-
          ./gradlew jvmTest --no-daemon
          -Panitomy.jvmNativesDir=build/ci-jvm
      - name: Verify Java 17 bytecode
        run: |
          javap -verbose \
            build/classes/kotlin/jvm/main/pw/vodes/anitomy/AnitomyKt.class |
            grep "major version: 61"

  linux-native:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linuxX64
            compiler_package: gxx_linux-64
            sysroot_package: sysroot_linux-64
            compiler: x86_64-conda-linux-gnu-c++
            gradle_task: linuxX64Test
            cmake_system: ""
            cmake_processor: ""
            copy_sysroot: "false"
          - target: linuxArm64
            compiler_package: gxx_linux-aarch64
            sysroot_package: sysroot_linux-aarch64
            compiler: aarch64-conda-linux-gnu-c++
            gradle_task: linkDebugTestLinuxArm64
            cmake_system: Linux
            cmake_processor: aarch64
            copy_sysroot: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build portable native archive
        uses: ./.github/actions/build-linux-native
        with:
          target: ${{ matrix.target }}
          compiler-package: ${{ matrix.compiler_package }}
          sysroot-package: ${{ matrix.sysroot_package }}
          compiler: ${{ matrix.compiler }}
          cmake-system: ${{ matrix.cmake_system }}
          cmake-processor: ${{ matrix.cmake_processor }}
          copy-sysroot: ${{ matrix.copy_sysroot }}
      - name: Compile and test Kotlin/Native binding
        run: >-
          ./gradlew ${{ matrix.gradle_task }} --no-daemon
          -Panitomy.nativeLibraryDir.${{ matrix.target }}=build/native/${{ matrix.target }}
      - name: Verify native artifact structure
        run: >-
          scripts/verify-native-artifacts.sh
          ${{ matrix.target }}
          build/native/${{ matrix.target }}
          --check-cinterop
      - name: Test release-style Linux JNI library
        if: matrix.target == 'linuxX64'
        run: |
          mkdir -p build/ci-jvm/linux-x64
          cp build/native/linuxX64/libanitomy-kmp.so build/ci-jvm/linux-x64/
          ./gradlew jvmTest --no-daemon -Panitomy.jvmNativesDir=build/ci-jvm
      - name: Run ARM64 tests under QEMU
        if: matrix.target == 'linuxArm64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user
          qemu-aarch64 \
            -L build/native/linuxArm64/sysroot \
            build/bin/linuxArm64/debugTest/test.kexe

  windows-native:
    name: mingwX64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
      - name: Build MinGW native archive
        shell: msys2 {0}
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          ANITOMY_BUILD_JNI=ON CXX=g++ scripts/build-native.sh mingwX64
      - name: Stage Windows JNI library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/ci-jvm/windows-x64
          Copy-Item build/native/mingwX64/anitomy-kmp.dll build/ci-jvm/windows-x64/
      - name: Test Kotlin/Native and JVM bindings
        shell: pwsh
        env:
          ORG_GRADLE_PROJECT_anitomy.nativeLibraryDir.mingwX64: build/native/mingwX64
          ORG_GRADLE_PROJECT_anitomy.jvmNativesDir: build/ci-jvm
        run: ./gradlew.bat mingwX64Test jvmTest --no-daemon
      - name: Verify native artifact structure
        shell: msys2 {0}
        run: >-
          scripts/verify-native-artifacts.sh mingwX64 build/native/mingwX64
          --check-cinterop

  macos-native:
    name: macosArm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install GCC 15 and Ninja
        run: brew install gcc@15 ninja
      - name: Build GCC 15 native archive
        run: |
          gxx="$(brew --prefix gcc@15)/bin/g++-15"
          ANITOMY_BUILD_JNI=ON ANITOMY_BUILD_TESTS=ON CXX="${gxx}" \
            scripts/build-native.sh macosArm64
          ctest --test-dir build/native/macosArm64 --output-on-failure
      - name: Stage macOS JNI library
        run: |
          mkdir -p build/ci-jvm/macos-arm64
          cp build/native/macosArm64/libanitomy-kmp.dylib build/ci-jvm/macos-arm64/
      - name: Test Kotlin/Native and JVM bindings
        run: >-
          ./gradlew macosArm64Test jvmTest --no-daemon
          -Panitomy.nativeLibraryDir.macosArm64=build/native/macosArm64
          -Panitomy.jvmNativesDir=build/ci-jvm
      - name: Verify native artifact structure
        run: >-
          scripts/verify-native-artifacts.sh macosArm64 build/native/macosArm64
          --check-cinterop
