name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: Validate version tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a semantic version tag: $TAG" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  linux-artifacts:
    name: ${{ matrix.target }} release artifacts
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linuxX64
            resource: linux-x64
            compiler_package: gxx_linux-64
            sysroot_package: sysroot_linux-64
            compiler: x86_64-conda-linux-gnu-c++
            cmake_system: ""
            cmake_processor: ""
          - target: linuxArm64
            resource: linux-arm64
            compiler_package: gxx_linux-aarch64
            sysroot_package: sysroot_linux-aarch64
            compiler: aarch64-conda-linux-gnu-c++
            cmake_system: Linux
            cmake_processor: aarch64
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build native archive and JNI library
        env:
          TARGET: ${{ matrix.target }}
          COMPILER_PACKAGE: ${{ matrix.compiler_package }}
          SYSROOT_PACKAGE: ${{ matrix.sysroot_package }}
          COMPILER: ${{ matrix.compiler }}
          CMAKE_SYSTEM: ${{ matrix.cmake_system }}
          CMAKE_PROCESSOR: ${{ matrix.cmake_processor }}
        run: |
          docker run --rm \
            -e TARGET -e COMPILER_PACKAGE -e SYSROOT_PACKAGE -e COMPILER \
            -e CMAKE_SYSTEM -e CMAKE_PROCESSOR \
            -v "$GITHUB_WORKSPACE:/work" -v "$JAVA_HOME:/jdk:ro" \
            -w /work \
            quay.io/condaforge/miniforge3@sha256:ccd8a580bf94ec3cd6e8b35ed243a2b88394fe5a3ccb5da97ee3400c1bbcd5f9 \
            bash -lc '
              conda create --quiet --yes -p /toolchain -c conda-forge \
                "${COMPILER_PACKAGE}=15.2.0" "${SYSROOT_PACKAGE}=2.17" \
                cmake=4.3.4 ninja=1.13.2
              export PATH="/toolchain/bin:${PATH}"
              export CXX="/toolchain/bin/${COMPILER}"
              export JAVA_HOME=/jdk
              export ANITOMY_BUILD_JNI=ON
              export ANITOMY_CMAKE_SYSTEM_NAME="${CMAKE_SYSTEM}"
              export ANITOMY_CMAKE_SYSTEM_PROCESSOR="${CMAKE_PROCESSOR}"
              scripts/build-native.sh "${TARGET}"
              chmod -R a+rwX "build/native/${TARGET}"
            '
      - name: Stage release files
        env:
          TARGET: ${{ matrix.target }}
          RESOURCE: ${{ matrix.resource }}
        run: |
          mkdir -p "build/release/native/${TARGET}" "build/release/jvm/${RESOURCE}"
          cp build/native/"${TARGET}"/libanitomy-bridge.a \
            build/native/"${TARGET}"/libstdc++.a \
            build/native/"${TARGET}"/libgcc.a \
            build/native/"${TARGET}"/libgcc_eh.a \
            "build/release/native/${TARGET}/"
          cp build/native/"${TARGET}"/libanitomy-kmp.so \
            "build/release/jvm/${RESOURCE}/"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: build/release
          if-no-files-found: error

  windows-artifacts:
    name: mingwX64 release artifacts
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
      - name: Build MinGW archive and JNI library
        shell: msys2 {0}
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          ANITOMY_BUILD_JNI=ON CXX=g++ scripts/build-native.sh mingwX64
      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/release/native/mingwX64
          New-Item -ItemType Directory -Force build/release/jvm/windows-x64
          Copy-Item -Path @(
            "build/native/mingwX64/libanitomy-bridge.a"
            "build/native/mingwX64/libstdc++.a"
            "build/native/mingwX64/libgcc.a"
            "build/native/mingwX64/libgcc_eh.a"
          ) -Destination build/release/native/mingwX64/
          Copy-Item build/native/mingwX64/anitomy-kmp.dll build/release/jvm/windows-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: release-mingwX64
          path: build/release
          if-no-files-found: error

  macos-artifacts:
    name: macosArm64 release artifacts
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Ninja
        run: brew install ninja
      - name: Build Apple Clang archive and JNI library
        run: ANITOMY_BUILD_JNI=ON CXX=clang++ scripts/build-native.sh macosArm64
      - name: Stage release files
        run: |
          mkdir -p build/release/native/macosArm64 build/release/jvm/macos-arm64
          cp build/native/macosArm64/libanitomy-bridge.a \
            build/release/native/macosArm64/
          cp build/native/macosArm64/libanitomy-kmp.dylib \
            build/release/jvm/macos-arm64/
      - uses: actions/upload-artifact@v4
        with:
          name: release-macosArm64
          path: build/release
          if-no-files-found: error

  publish-main:
    name: Publish root, JVM, Linux, and Windows modules
    needs:
      - version
      - linux-artifacts
      - windows-artifacts
      - macos-artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: build/release
          merge-multiple: true
      - name: Publish non-Apple modules
        env:
          STYX_REPO_TOKEN: ${{ secrets.STYX_REPO_TOKEN }}
          STYX_REPO_SECRET: ${{ secrets.STYX_REPO_SECRET }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew --no-daemon \
            publishKotlinMultiplatformPublicationToStyxRepository \
            publishJvmPublicationToStyxRepository \
            publishLinuxX64PublicationToStyxRepository \
            publishLinuxArm64PublicationToStyxRepository \
            publishMingwX64PublicationToStyxRepository \
            "-PreleaseVersion=${VERSION}" \
            -Panitomy.jvmNativesDir=build/release/jvm \
            -Panitomy.nativeLibraryDir.linuxX64=build/release/native/linuxX64 \
            -Panitomy.nativeLibraryDir.linuxArm64=build/release/native/linuxArm64 \
            -Panitomy.nativeLibraryDir.mingwX64=build/release/native/mingwX64

  publish-macos:
    name: Publish macOS ARM64 module
    needs:
      - version
      - macos-artifacts
      - publish-main
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          name: release-macosArm64
          path: build/release
      - name: Publish Apple module
        env:
          STYX_REPO_TOKEN: ${{ secrets.STYX_REPO_TOKEN }}
          STYX_REPO_SECRET: ${{ secrets.STYX_REPO_SECRET }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew --no-daemon \
            publishMacosArm64PublicationToStyxRepository \
            "-PreleaseVersion=${VERSION}" \
            -Panitomy.nativeLibraryDir.macosArm64=build/release/native/macosArm64
